<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#bcdcff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="루이 사과 게임" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <title>루이 사과 게임 — 합이 10</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #bcdcff;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #1a1a1a;
      touch-action: auto;
    }
    #layout {
      width: min(1100px, 98vw);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 12px 10px;
      padding-left: max(10px, env(safe-area-inset-left));
      padding-right: max(10px, env(safe-area-inset-right));
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    #main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      gap: 3px;
    }
    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: center;
      gap: 0.35em 0.5em;
      margin: 0;
    }
    .title-row h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
    }
    #app-build {
      font-size: 0.65rem;
      font-weight: 500;
      opacity: 0.55;
      margin-left: 0.15em;
    }
    .title-row .last-modified {
      font-size: max(9px, calc(1.1rem * 0.4));
      font-weight: 500;
      line-height: 1.2;
      color: rgba(26, 26, 26, 0.62);
      white-space: nowrap;
    }
    #status {
      font-size: 0.95rem;
      margin: 0;
      opacity: 0.95;
      text-align: center;
    }
    canvas {
      display: block;
      cursor: crosshair;
      border-radius: 8px;
      touch-action: none;
      max-width: min(96vw, 520px);
      height: auto;
    }
    canvas.ended { pointer-events: none; cursor: default; opacity: 0.85; }
    #settings {
      width: min(980px, 96vw);
      font-size: clamp(0.68rem, 2.4vw, 0.88rem);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(0, 0, 0, 0.10);
      border-radius: 8px;
      padding: 2px 6px;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    #settings h2 {
      margin: 0;
      font-size: 1em;
      white-space: nowrap;
    }
    .field {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 0;
    }
    .field label { font-size: 1em; opacity: 0.9; }
    .field select {
      font: inherit;
      font-size: 1em;
      line-height: 1.3;
      min-height: 0;
      padding: 2px 5px;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.18);
      background: rgba(255, 255, 255, 0.9);
      cursor: pointer;
    }
    #rows-select { width: 52px; }
    #timer-select { width: 72px; }
    .settings-apply-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    #apply-btn,
    #pause-btn {
      font: inherit;
      font-size: 1em;
      font-weight: 700;
      line-height: 1.3;
      min-height: 0;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    #apply-btn {
      border: none;
      background: #1a4a8a;
      color: white;
    }
    #apply-btn:hover { filter: brightness(1.05); }
    #apply-btn:active { transform: scale(0.99); }
    #pause-btn {
      border: 1.5px solid #1a4a8a;
      background: rgba(255, 255, 255, 0.92);
      color: #1a4a8a;
    }
    #pause-btn:hover { filter: brightness(1.02); }
    #pause-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .high-scores {
      margin: 0;
      font-size: 0.9em;
      opacity: 0.9;
      line-height: 1.25;
      text-align: left;
      white-space: nowrap;
    }
    .high-scores strong { font-weight: 700; }
    .high-scores-sep {
      opacity: 0.45;
      padding: 0 0.15em;
    }
    @media (max-width: 900px) {
      #settings { width: min(96vw, 520px); }
      canvas { max-width: 96vw; }
    }
    @media (orientation: landscape) and (max-height: 560px) {
      #settings {
        flex-wrap: nowrap;
        align-items: center;
        justify-content: flex-start;
        width: min(100%, 96vw);
        max-width: none;
        gap: 5px;
        padding: 2px 6px;
        font-size: clamp(0.62rem, 2.2vmin, 0.78rem);
        overflow-x: auto;
      }
      #settings h2 { flex-shrink: 0; }
      .field { flex-shrink: 0; }
      .field select {
        width: 50px;
        min-height: 34px;
        padding: 2px 4px;
      }
      #timer-select { width: 62px; }
      #apply-btn,
      #pause-btn {
        flex-shrink: 0;
        min-height: 34px;
        padding: 2px 7px;
      }
      .settings-apply-row {
        flex-wrap: nowrap;
        flex-shrink: 0;
      }
      .high-scores { font-size: 0.88em; }
    }
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 16px;
    }
    #overlay.show { display: flex; }
    #overlay-box {
      position: relative;
      background: #2d5016;
      border: 2px solid #ffe066;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: center;
      min-width: 260px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    #overlay-close-btn {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
    }
    #overlay-close-btn:hover { filter: brightness(1.08); }
    #overlay-box h2 {
      margin: 0 0 12px;
      font-size: 1.25rem;
      font-weight: 700;
    }
    #final-score {
      margin: 0 0 20px;
      font-size: 1.05rem;
      white-space: pre-line;
    }
    #restart-btn,
    #remain-btn {
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      background: #ffe066;
      color: #1a1a1a;
      cursor: pointer;
    }
    #restart-btn:hover,
    #remain-btn:hover { filter: brightness(1.05); }
    #restart-btn:active,
    #remain-btn:active { transform: scale(0.98); }
    #pause-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 12;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: rgba(160, 195, 235, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    #pause-overlay.show { display: flex; }
    #resume-btn {
      font: inherit;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      font-weight: 700;
      padding: 14px 40px;
      border: none;
      border-radius: 12px;
      background: #1a4a8a;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(26, 74, 138, 0.35);
    }
    #resume-btn:hover { filter: brightness(1.06); }
    #resume-btn:active { transform: scale(0.98); }
    @media (max-width: 520px) {
      #overlay-box {
        width: min(360px, calc(100vw - 28px));
        padding: 22px 18px;
      }
      #restart-btn,
      #remain-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="layout">
    <div id="main">
      <header class="title-row">
        <h1>루이 사과 게임<span id="app-build" aria-hidden="true"></span></h1>
        <time id="last-modified" class="last-modified" datetime=""></time>
      </header>
      <aside id="settings">
        <h2>사용자 설정</h2>
        <div class="field">
          <label for="rows-select">세로 타일</label>
          <select id="rows-select" aria-label="세로 타일 수">
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8" selected>8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>
        <div class="field">
          <label for="timer-select">타이머</label>
          <select id="timer-select" aria-label="제한 시간"></select>
        </div>
        <div class="settings-apply-row">
          <button type="button" id="apply-btn">적용</button>
          <button type="button" id="pause-btn" disabled>일시정지</button>
          <p id="high-scores" class="high-scores" aria-live="polite">
            <span>오늘 최고 <strong id="high-day">0</strong>점</span><span class="high-scores-sep">·</span><span>역대 최고 <strong id="high-all">0</strong>점</span>
          </p>
        </div>
      </aside>
      <p id="status"></p>
      <canvas id="board"></canvas>
    </div>
  </div>

  <div id="overlay" aria-hidden="true">
    <div id="overlay-box">
      <button type="button" id="overlay-close-btn" aria-label="닫기">×</button>
      <h2 id="overlay-title">시간 종료</h2>
      <p id="final-score"></p>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button type="button" id="restart-btn">다시 하기</button>
        <button type="button" id="remain-btn" style="display:none;">남은 타일 확인하기</button>
      </div>
    </div>
  </div>

  <div id="pause-overlay" aria-hidden="true">
    <button type="button" id="resume-btn">이어하기</button>
  </div>

  <script>
    const APP_BUILD = "10";
    const BUILD_STORAGE_KEY = "luisegame-app-build";

    (function showBuildBadge() {
      const el = document.getElementById("app-build");
      if (el) el.textContent = " · 빌드 " + APP_BUILD;
    })();

    function formatLastModified() {
      const el = document.getElementById("last-modified");
      if (!el) return;
      const d = new Date(document.lastModified);
      if (isNaN(d.getTime())) return;
      el.setAttribute("datetime", d.toISOString().slice(0, 10));
      el.textContent =
        "최종 수정 " +
        new Intl.DateTimeFormat("ko-KR", {
          year: "numeric",
          month: "long",
          day: "numeric",
        }).format(d);
    }
    formatLastModified();

    async function purgeStalePwaCacheIfNeeded() {
      if (localStorage.getItem(BUILD_STORAGE_KEY) === APP_BUILD) return;
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      } catch (_) {
        /* ignore */
      }
      localStorage.setItem(BUILD_STORAGE_KEY, APP_BUILD);
      if (localStorage.getItem(BUILD_STORAGE_KEY + "-reloaded") !== APP_BUILD) {
        localStorage.setItem(BUILD_STORAGE_KEY + "-reloaded", APP_BUILD);
        window.location.reload();
      }
    }

    const ROWS_MIN = 4;
    const ROWS_MAX = 12;
    const TIMER_MIN = 10;
    const TIMER_MAX = 300;
    const TIMER_STEP = 10;
    const USER_SETTINGS_KEY = "luisegame-apple-user-settings";
    const HIGH_ALL_KEY = "luisegame-apple-high-all";
    const HIGH_DAY_KEY = "luisegame-apple-high-day";

    let ROWS = 8;
    let COLS = ROWS * 2;
    let CELL = 28;
    const PAD = 14;
    let GAME_SECONDS = 120;

    function refreshCellSize() {
      const vv = window.visualViewport;
      const iw = Math.min(
        vv && vv.width ? vv.width : 1e9,
        window.innerWidth || 1024,
        document.documentElement.clientWidth || 1024
      );
      const ih = Math.min(
        vv && vv.height ? vv.height : 1e9,
        window.innerHeight || 800
      );
      const maxBoardCssW = Math.min(520, iw * 0.96) - 8;
      const cellFromW = Math.floor((maxBoardCssW - PAD * 2) / COLS);
      const reserved = Math.min(260, Math.max(180, ih * 0.38));
      const maxBoardCssH = Math.max(140, ih - reserved);
      const cellFromH = Math.floor((maxBoardCssH - PAD * 2) / ROWS);
      CELL = Math.max(22, Math.min(40, Math.min(cellFromW, cellFromH)));
    }

    function getFontPx() {
      return Math.max(11, Math.round(CELL * 0.56));
    }

    function loadPersistedUserSettings() {
      try {
        const raw = localStorage.getItem(USER_SETTINGS_KEY);
        if (!raw) return null;
        const o = JSON.parse(raw);
        if (!o || typeof o !== "object") return null;
        let rows = Math.floor(Number(o.rows));
        let timer = Math.floor(Number(o.timer));
        if (!Number.isFinite(rows) || !Number.isFinite(timer)) return null;
        rows = Math.max(ROWS_MIN, Math.min(ROWS_MAX, rows));
        timer = Math.max(
          TIMER_MIN,
          Math.min(TIMER_MAX, Math.round(timer / TIMER_STEP) * TIMER_STEP)
        );
        return { rows, timer };
      } catch (_) {
        return null;
      }
    }

    function persistUserSettings(rows, timer) {
      try {
        localStorage.setItem(USER_SETTINGS_KEY, JSON.stringify({ rows, timer }));
      } catch (_) {
        /* ignore */
      }
    }

    function todayLocalISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }

    function updateHighScoreDisplay() {
      let allScore = 0;
      let dayScore = 0;
      try {
        const allRaw = localStorage.getItem(HIGH_ALL_KEY);
        const allN = Math.floor(Number(allRaw));
        if (Number.isFinite(allN) && allN > 0) allScore = allN;
        const dayRaw = localStorage.getItem(HIGH_DAY_KEY);
        if (dayRaw) {
          const o = JSON.parse(dayRaw);
          if (o && o.day === todayLocalISO()) {
            const n = Math.floor(Number(o.score));
            if (Number.isFinite(n) && n > 0) dayScore = n;
          }
        }
      } catch (_) {
        /* ignore */
      }
      if (highDayEl) highDayEl.textContent = String(dayScore);
      if (highAllEl) highAllEl.textContent = String(allScore);
    }

    function recordHighScores(finalScore) {
      const score = Math.floor(Number(finalScore));
      if (!Number.isFinite(score) || score <= 0) return;
      try {
        const prevAll = Math.floor(Number(localStorage.getItem(HIGH_ALL_KEY))) || 0;
        if (score > prevAll) localStorage.setItem(HIGH_ALL_KEY, String(score));
        const today = todayLocalISO();
        let dayScore = 0;
        const dayRaw = localStorage.getItem(HIGH_DAY_KEY);
        if (dayRaw) {
          const o = JSON.parse(dayRaw);
          if (o && o.day === today) dayScore = Math.floor(Number(o.score)) || 0;
        }
        if (score > dayScore) {
          localStorage.setItem(HIGH_DAY_KEY, JSON.stringify({ day: today, score }));
        }
      } catch (_) {
        /* ignore */
      }
      updateHighScoreDisplay();
    }

    const canvas = document.getElementById("board");
    let ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const overlay = document.getElementById("overlay");
    const overlayTitleEl = document.getElementById("overlay-title");
    const finalScoreEl = document.getElementById("final-score");
    const restartBtn = document.getElementById("restart-btn");
    const remainBtn = document.getElementById("remain-btn");
    const overlayCloseBtn = document.getElementById("overlay-close-btn");
    const rowsSelect = document.getElementById("rows-select");
    const timerSelect = document.getElementById("timer-select");
    const applyBtn = document.getElementById("apply-btn");
    const pauseBtn = document.getElementById("pause-btn");
    const pauseOverlay = document.getElementById("pause-overlay");
    const resumeBtn = document.getElementById("resume-btn");
    const highDayEl = document.getElementById("high-day");
    const highAllEl = document.getElementById("high-all");

    function populateTimerSelect() {
      timerSelect.innerHTML = "";
      for (let s = TIMER_MIN; s <= TIMER_MAX; s += TIMER_STEP) {
        const opt = document.createElement("option");
        opt.value = String(s);
        opt.textContent = s + "초";
        timerSelect.appendChild(opt);
      }
    }
    populateTimerSelect();

    const saved = loadPersistedUserSettings();
    if (saved) {
      ROWS = saved.rows;
      GAME_SECONDS = saved.timer;
    }
    ROWS = Math.max(ROWS_MIN, Math.min(ROWS_MAX, ROWS));
    COLS = ROWS * 2;
    GAME_SECONDS = Math.max(
      TIMER_MIN,
      Math.min(TIMER_MAX, Math.round(GAME_SECONDS / TIMER_STEP) * TIMER_STEP)
    );
    rowsSelect.value = String(ROWS);
    timerSelect.value = String(GAME_SECONDS);
    updateHighScoreDisplay();

    function hidePauseUI(redraw) {
      const wasPaused = paused;
      paused = false;
      if (pauseOverlay) {
        pauseOverlay.classList.remove("show");
        pauseOverlay.setAttribute("aria-hidden", "true");
      }
      updatePauseButtonState();
      if (redraw !== false && wasPaused) flushDraw();
    }

    function showPauseUI() {
      if (!gameRunning || paused) return;
      paused = true;
      dragging = false;
      anchor = null;
      dragCorner = null;
      dragStartPos = null;
      dragNowPos = null;
      path = [];
      dragCanvasRect = null;
      if (pauseOverlay) {
        pauseOverlay.classList.add("show");
        pauseOverlay.setAttribute("aria-hidden", "false");
      }
      updatePauseButtonState();
      flushDraw();
    }

    function updatePauseButtonState() {
      if (pauseBtn) pauseBtn.disabled = !gameRunning || paused;
    }

    /** 축 정렬 사과 실루엣 (중심 cx,cy · 반지름 R) */
    function buildAppleBodyPath(cx, cy, R) {
      ctx.beginPath();
      ctx.moveTo(cx, cy - R * 0.88);
      ctx.bezierCurveTo(
        cx - R * 0.42,
        cy - R * 0.8,
        cx - R * 0.95,
        cy - R * 0.18,
        cx - R * 0.9,
        cy + R * 0.4
      );
      ctx.bezierCurveTo(cx - R * 0.72, cy + R * 0.85, cx - R * 0.26, cy + R * 1.05, cx, cy + R * 0.98);
      ctx.bezierCurveTo(cx + R * 0.26, cy + R * 1.05, cx + R * 0.72, cy + R * 0.85, cx + R * 0.9, cy + R * 0.4);
      ctx.bezierCurveTo(cx + R * 0.95, cy - R * 0.18, cx + R * 0.42, cy - R * 0.8, cx, cy - R * 0.88);
      ctx.closePath();
    }

    function drawStemLeaf(cx, cy, R, stemCols) {
      ctx.save();
      ctx.strokeStyle = stemCols.stroke;
      ctx.lineWidth = Math.max(1, R * 0.13);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(cx, cy - R * 0.86);
      ctx.quadraticCurveTo(cx + R * 0.1, cy - R * 1.12, cx + R * 0.26, cy - R * 0.94);
      ctx.stroke();
      ctx.fillStyle = stemCols.leaf;
      ctx.beginPath();
      ctx.ellipse(cx + R * 0.34, cy - R * 1.02, R * 0.24, R * 0.13, -0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /** 빈 칸 / 숫자 칸 공통 사과 실루엣 채우기 */
    function drawAppleTile(cx, cy, R, opts) {
      const sel = opts.selected;
      const empty = opts.empty;

      buildAppleBodyPath(cx, cy, R);

      if (empty) {
        ctx.fillStyle = "#bcdcff";
        ctx.strokeStyle = sel ? "#ffb366" : "rgba(0,0,0,0.08)";
        ctx.lineWidth = sel ? 2 : 1.2;
        ctx.fill();
        ctx.stroke();
        return;
      }

      const g = ctx.createRadialGradient(
        cx - R * 0.35,
        cy - R * 0.42,
        R * 0.08,
        cx + R * 0.15,
        cy + R * 0.2,
        R * 1.25
      );
      g.addColorStop(0, "#ffc9c9");
      g.addColorStop(0.35, "#f94144");
      g.addColorStop(0.7, "#c1121f");
      g.addColorStop(1, "#660708");
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = sel ? "#7a0b0d" : "#380607";
      ctx.lineWidth = sel ? 2.6 : 1.35;
      ctx.stroke();

      const hg = ctx.createRadialGradient(cx - R * 0.45, cy - R * 0.5, 0, cx - R * 0.35, cy - R * 0.4, R * 0.85);
      hg.addColorStop(0, "rgba(255,255,255,0.45)");
      hg.addColorStop(0.35, "rgba(255,255,255,0.08)");
      hg.addColorStop(1, "rgba(255,255,255,0)");
      buildAppleBodyPath(cx, cy, R);
      ctx.fillStyle = hg;
      ctx.fill();

      drawStemLeaf(cx, cy, R, { stroke: "#4e3728", leaf: "#6aaf40" });
    }

    function resizeCanvas() {
      refreshCellSize();
      const w = COLS * CELL + PAD * 2;
      const h = ROWS * CELL + PAD * 2;
      canvas.width = w;
      canvas.height = h;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx = canvas.getContext("2d");
    }

    function ensureGridReady() {
      if (
        !Array.isArray(grid) ||
        grid.length !== ROWS ||
        !grid[0] ||
        grid[0].length !== COLS
      ) {
        buildFullGrid();
      }
    }

    /** 1~6이 7~9보다 자주 나오도록 (약 2:1) */
    function rand1to9() {
      if (Math.random() < 2 / 3) {
        return 1 + Math.floor(Math.random() * 6);
      }
      return 7 + Math.floor(Math.random() * 3);
    }

    let grid = [];
    let anchor = null;
    let dragCorner = null;
    let path = [];
    let dragging = false;
    let paused = false;
    let score = 0;
    let timeLeft = GAME_SECONDS;
    let gameRunning = false;
    let timerId = null;
    let endedBy = null;
    let previewMode = false;
    let previewMoves = [];
    let previewIndex = 0;
    let previewRect = null;
    let dragStartPos = null;
    let dragNowPos = null;
    let drawRafId = null;
    let dragCanvasRect = null;
    const CLEAR_POP_MS = 500;
    const CLEAR_POP_SRC = "./clear-pop.png";
    const clearPopImage = new Image();
    let clearPopReady = false;
    let clearPopEffects = [];
    let clearPopRafId = null;
    clearPopImage.addEventListener("load", () => {
      clearPopReady = true;
      draw();
    });
    clearPopImage.src = CLEAR_POP_SRC;

    function addClearPopEffects(cells) {
      const until = performance.now() + CLEAR_POP_MS;
      for (const [r, c] of cells) {
        clearPopEffects.push({ r, c, until });
      }
      ensureClearPopLoop();
    }

    function ensureClearPopLoop() {
      if (clearPopRafId != null) return;
      const tick = () => {
        const now = performance.now();
        clearPopEffects = clearPopEffects.filter((e) => e.until > now);
        draw();
        if (clearPopEffects.length > 0) {
          clearPopRafId = requestAnimationFrame(tick);
        } else {
          clearPopRafId = null;
        }
      };
      clearPopRafId = requestAnimationFrame(tick);
    }

    let audioCtx = null;
    function playClearSound(clearedCount) {
      try {
        const base = Math.max(1, Math.floor(clearedCount || 1));
        const n = Math.max(1, Math.min(24, base >= 2 ? (base - 1) * 4 : 1));
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;

        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(1.68, now + 0.01);
        const step = 0.075;
        const totalDur = Math.min(0.95, 0.10 + n * step);
        master.gain.exponentialRampToValueAtTime(0.0001, now + totalDur);
        master.connect(audioCtx.destination);

        const freqs = [740.0, 880.0, 1108.73, 1320.0, 1760.0, 2217.46];

        for (let i = 0; i < n; i++) {
          const t0 = now + i * step;
          const t1 = t0 + step * 0.98;
          const f = freqs[Math.min(freqs.length - 1, i)];

          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(f, t0);

          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(1.20, t0 + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t1);

          osc.connect(g);
          g.connect(master);
          osc.start(t0);
          osc.stop(t1 + 0.01);
        }
      } catch (_) {
        /* ignore */
      }
    }

    let spoken30 = false;
    let lastCountdownSpoken = null;
    function playTimerCue(secLeft) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;

        const playBeep = (freq, start, dur, vol) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, start);
          g.gain.setValueAtTime(0.0001, start);
          g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + dur + 0.01);
        };

        if (secLeft === 30) {
          const total = 2.5;
          const interval = 0.33;
          const dur = 0.16;
          for (let t = 0; t < total; t += interval) {
            const f = Math.floor(t / interval) % 2 === 0 ? 880 : 1174.66;
            playBeep(f, now + t, dur, 0.16);
          }
          return;
        }
        const high = secLeft <= 3;
        playBeep(high ? 1320 : 1046.5, now, 0.13, 0.18);
      } catch (_) {
        /* ignore */
      }
    }

    function buildPrefixSum() {
      const ps = Array.from({ length: ROWS + 1 }, () => Array(COLS + 1).fill(0));
      for (let r = 0; r < ROWS; r++) {
        let rowSum = 0;
        for (let c = 0; c < COLS; c++) {
          rowSum += grid[r][c] || 0;
          ps[r + 1][c + 1] = ps[r][c + 1] + rowSum;
        }
      }
      return ps;
    }

    function rectSum(ps, r0, c0, r1, c1) {
      const rmin = Math.min(r0, r1);
      const rmax = Math.max(r0, r1);
      const cmin = Math.min(c0, c1);
      const cmax = Math.max(c0, c1);
      return ps[rmax + 1][cmax + 1] - ps[rmin][cmax + 1] - ps[rmax + 1][cmin] + ps[rmin][cmin];
    }

    function anyMoveExists() {
      const ps = buildPrefixSum();
      for (let r0 = 0; r0 < ROWS; r0++) {
        for (let c0 = 0; c0 < COLS; c0++) {
          for (let r1 = r0; r1 < ROWS; r1++) {
            for (let c1 = c0; c1 < COLS; c1++) {
              const cellCount = (r1 - r0 + 1) * (c1 - c0 + 1);
              if (cellCount < 2) continue;
              if (rectSum(ps, r0, c0, r1, c1) === 10) return true;
            }
          }
        }
      }
      return false;
    }

    function gridIsFullyCleared() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] != null) return false;
        }
      }
      return true;
    }

    function collectMoves(limit = 200) {
      const ps = buildPrefixSum();
      const moves = [];
      for (let r0 = 0; r0 < ROWS; r0++) {
        for (let c0 = 0; c0 < COLS; c0++) {
          for (let r1 = r0; r1 < ROWS; r1++) {
            for (let c1 = c0; c1 < COLS; c1++) {
              const cellCount = (r1 - r0 + 1) * (c1 - c0 + 1);
              if (cellCount < 2) continue;
              if (rectSum(ps, r0, c0, r1, c1) === 10) {
                moves.push({ r0, c0, r1, c1 });
                if (moves.length >= limit) return moves;
              }
            }
          }
        }
      }
      return moves;
    }

    function cellsInRect(r0, c0, r1, c1) {
      const rmin = Math.min(r0, r1);
      const rmax = Math.max(r0, r1);
      const cmin = Math.min(c0, c1);
      const cmax = Math.max(c0, c1);
      const cells = [];
      for (let r = rmin; r <= rmax; r++) {
        for (let c = cmin; c <= cmax; c++) {
          cells.push([r, c]);
        }
      }
      return cells;
    }

    function pathHas(r, c) {
      return path.some(([pr, pc]) => pr === r && pc === c);
    }

    function scheduleDraw() {
      if (drawRafId != null) return;
      drawRafId = requestAnimationFrame(() => {
        drawRafId = null;
        draw();
      });
    }

    function flushDraw() {
      if (drawRafId != null) {
        cancelAnimationFrame(drawRafId);
        drawRafId = null;
      }
      draw();
    }

    function getCanvasPoint(clientX, clientY, rectOpt) {
      const rect = rectOpt || canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (clientX - rect.left) * scaleX;
      const y = (clientY - rect.top) * scaleY;
      return { x, y };
    }

    function hitCell(clientX, clientY, rectOpt) {
      const { x, y } = getCanvasPoint(clientX, clientY, rectOpt);
      if (x < PAD || y < PAD) return null;
      const c = Math.floor((x - PAD) / CELL);
      const r = Math.floor((y - PAD) / CELL);
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return [r, c];
      return null;
    }

    function updateStatusText() {
      statusEl.textContent = "남은 시간 " + timeLeft + "초  |  점수 " + score + "점";
    }

    function draw() {
      if (!ctx) ctx = canvas.getContext("2d");
      ensureGridReady();
      ctx.fillStyle = "#bcdcff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      updateStatusText();

      const fontPx = getFontPx();
      let pathSet = null;
      if (path.length > 6) {
        pathSet = new Set();
        for (let i = 0; i < path.length; i++) {
          pathSet.add(path[i][0] + "," + path[i][1]);
        }
      }
      function cellInPath(r, c) {
        if (!path.length) return false;
        if (pathSet) return pathSet.has(r + "," + c);
        return pathHas(r, c);
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const val = grid[r][c];
          const inset = 0.5;
          const x0 = PAD + c * CELL + inset;
          const y0 = PAD + r * CELL + inset;
          const x1 = x0 + CELL - inset * 2;
          const y1 = y0 + CELL - inset * 2;
          const cx = (x0 + x1) / 2;
          const cy = (y0 + y1) / 2 + CELL * 0.05;
          const R = (Math.min(x1 - x0, y1 - y0) / 2) * 0.96;
          const sel = cellInPath(r, c);

          if (val == null) {
            drawAppleTile(cx, cy, R, { empty: true, selected: sel });
            continue;
          }
          drawAppleTile(cx, cy, R, { empty: false, selected: sel });
          ctx.font = "600 " + fontPx + "px Segoe UI, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#fffdf7";
          ctx.shadowColor = "rgba(49, 12, 12, 0.55)";
          ctx.shadowBlur = 3;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 1;
          ctx.fillText(String(val), cx, cy + R * 0.06);
          ctx.shadowColor = "transparent";
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;
        }
      }

      if (clearPopReady && clearPopEffects.length) {
        const now = performance.now();
        clearPopEffects = clearPopEffects.filter((e) => e.until > now);
        for (const e of clearPopEffects) {
          const inset = 0.5;
          const x0 = PAD + e.c * CELL + inset;
          const y0 = PAD + e.r * CELL + inset;
          const w = CELL - inset * 2;
          const h = CELL - inset * 2;
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(x0, y0, w, h, 6);
          ctx.clip();
          const iw = clearPopImage.naturalWidth;
          const ih = clearPopImage.naturalHeight;
          const scale = Math.max(w / iw, h / ih);
          const dw = iw * scale;
          const dh = ih * scale;
          const dx = x0 + (w - dw) / 2;
          const dy = y0 + (h - dh) / 2;
          ctx.drawImage(clearPopImage, dx, dy, dw, dh);
          ctx.restore();
        }
      }

      if (gameRunning && !paused && dragging && anchor && dragCorner) {
        ctx.save();
        if (dragStartPos && dragNowPos) {
          const rx = Math.min(dragStartPos.x, dragNowPos.x);
          const ry = Math.min(dragStartPos.y, dragNowPos.y);
          const rw = Math.abs(dragNowPos.x - dragStartPos.x);
          const rh = Math.abs(dragNowPos.y - dragStartPos.y);
          ctx.fillStyle = "rgba(26, 74, 138, 0.08)";
          ctx.beginPath();
          ctx.roundRect(rx, ry, rw, rh, 10);
          ctx.fill();
        }
        ctx.restore();
      }

      if (previewMode && previewRect) {
        const rmin = Math.min(previewRect.r0, previewRect.r1);
        const rmax = Math.max(previewRect.r0, previewRect.r1);
        const cmin = Math.min(previewRect.c0, previewRect.c1);
        const cmax = Math.max(previewRect.c0, previewRect.c1);
        const x = PAD + cmin * CELL + 1;
        const y = PAD + rmin * CELL + 1;
        const w = (cmax - cmin + 1) * CELL - 2;
        const h = (rmax - rmin + 1) * CELL - 2;
        ctx.save();
        ctx.fillStyle = "rgba(255, 190, 11, 0.20)";
        ctx.strokeStyle = "rgba(255, 119, 0, 0.95)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 10);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    function endGame(reason) {
      if (!gameRunning) return;
      hidePauseUI();
      gameRunning = false;
      dragging = false;
      anchor = null;
      dragCorner = null;
      path = [];
      dragCanvasRect = null;
      clearInterval(timerId);
      timerId = null;
      endedBy = reason;
      previewMode = false;
      previewMoves = [];
      previewIndex = 0;
      previewRect = null;
      canvas.classList.add("ended");
      updatePauseButtonState();
      recordHighScores(score);

      const finalLine = "최종 점수: " + score + "점";
      if (reason === "nomoves") {
        if (gridIsFullyCleared()) {
          overlayTitleEl.textContent = "축하합니다! 모두 찾았습니다!";
          finalScoreEl.textContent = finalLine;
        } else {
          overlayTitleEl.textContent = "게임 종료";
          finalScoreEl.textContent =
            "더이상 타일을 찾을 수 없어 게임을 종료합니다!\n\n" + finalLine;
        }
        remainBtn.style.display = "none";
      } else {
        overlayTitleEl.textContent = "시간 종료";
        finalScoreEl.textContent = finalLine;
        remainBtn.style.display = anyMoveExists() ? "inline-block" : "none";
      }
      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
      draw();
    }

    function buildFullGrid() {
      grid = Array.from({ length: ROWS }, () =>
        Array.from({ length: COLS }, () => rand1to9())
      );
    }

    function startNewGame() {
      hidePauseUI(false);
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
      canvas.classList.remove("ended");
      clearInterval(timerId);
      timerId = null;

      buildFullGrid();
      resizeCanvas();
      let shuffleTries = 0;
      while (!anyMoveExists() && shuffleTries < 8) {
        buildFullGrid();
        shuffleTries++;
      }

      score = 0;
      timeLeft = GAME_SECONDS;
      path = [];
      anchor = null;
      dragCorner = null;
      dragging = false;
      dragCanvasRect = null;
      gameRunning = true;
      previewMode = false;
      previewMoves = [];
      previewIndex = 0;
      previewRect = null;
      spoken30 = false;
      lastCountdownSpoken = null;
      updatePauseButtonState();

      timerId = setInterval(() => {
        if (!gameRunning || paused) return;
        timeLeft--;
        if (timeLeft === 30 && !spoken30) {
          spoken30 = true;
          playTimerCue(30);
        }
        if (timeLeft <= 10 && timeLeft >= 1) {
          if (lastCountdownSpoken !== timeLeft) {
            lastCountdownSpoken = timeLeft;
            playTimerCue(timeLeft);
          }
        }
        if (timeLeft <= 0) {
          timeLeft = 0;
          endGame("time");
        }
        draw();
      }, 1000);

      draw();
      if (!anyMoveExists()) endGame("nomoves");
    }

    function onPointerDown(e) {
      if (paused) return;
      if (!gameRunning) {
        if (previewMode && previewMoves.length) {
          previewIndex = (previewIndex + 1) % previewMoves.length;
          const m = previewMoves[previewIndex];
          previewRect = m;
          path = [];
          flushDraw();
        }
        return;
      }
      const cell = hitCell(e.clientX, e.clientY);
      if (!cell) return;
      const [r, c] = cell;
      const p = getCanvasPoint(e.clientX, e.clientY);
      dragCanvasRect = canvas.getBoundingClientRect();
      dragging = true;
      anchor = [r, c];
      dragCorner = [r, c];
      dragStartPos = p;
      dragNowPos = p;
      path = cellsInRect(r, c, r, c);
      flushDraw();
    }

    function onPointerMove(e) {
      if (paused || !gameRunning || !dragging || !anchor) return;
      const cell = hitCell(e.clientX, e.clientY, dragCanvasRect);
      if (!cell) return;
      const [r, c] = cell;
      if (dragCorner && dragCorner[0] === r && dragCorner[1] === c) return;
      dragCorner = [r, c];
      dragNowPos = getCanvasPoint(e.clientX, e.clientY, dragCanvasRect);
      path = cellsInRect(anchor[0], anchor[1], r, c);
      scheduleDraw();
    }

    function onPointerUp(e) {
      if (!dragging) return;
      dragging = false;
      dragCanvasRect = null;
      if (paused || !gameRunning) {
        anchor = null;
        dragCorner = null;
        dragStartPos = null;
        dragNowPos = null;
        path = [];
        flushDraw();
        return;
      }

      if (anchor) {
        const end = e && typeof e.clientX === "number" ? hitCell(e.clientX, e.clientY) : null;
        if (end) dragCorner = end;
        if (e && typeof e.clientX === "number") dragNowPos = getCanvasPoint(e.clientX, e.clientY);
        const [r0, c0] = anchor;
        const [r1, c1] = dragCorner || anchor;
        const eff = cellsInRect(r0, c0, r1, c1);

        let total = 0;
        for (const [r, c] of eff) total += grid[r][c] || 0;

        if (eff.length >= 2 && total === 10) {
          let clearedNums = 0;
          const clearedCells = [];
          for (const [r, c] of eff) {
            if (grid[r][c] != null) {
              clearedNums++;
              clearedCells.push([r, c]);
            }
            grid[r][c] = null;
          }
          score += clearedNums;
          if (clearedCells.length > 0) addClearPopEffects(clearedCells);
          if (clearedNums > 0) playClearSound(clearedNums);
          if (!anyMoveExists()) {
            anchor = null;
            dragCorner = null;
            dragStartPos = null;
            dragNowPos = null;
            path = [];
            flushDraw();
            endGame("nomoves");
            return;
          }
        }
      }

      anchor = null;
      dragCorner = null;
      dragStartPos = null;
      dragNowPos = null;
      path = [];
      flushDraw();
    }

    function onViewportResize() {
      resizeCanvas();
      if (dragging) dragCanvasRect = canvas.getBoundingClientRect();
      draw();
    }

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointerleave", (ev) => {
      if (dragging) onPointerUp(ev);
    });
    window.addEventListener("resize", onViewportResize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", onViewportResize);
    }

    restartBtn.addEventListener("click", () => startNewGame());
    remainBtn.addEventListener("click", () => {
      if (endedBy !== "time") return;
      previewMoves = collectMoves(200);
      previewIndex = 0;
      previewMode = previewMoves.length > 0;
      if (previewMode) {
        const m = previewMoves[previewIndex];
        previewRect = m;
        path = [];
      } else {
        previewRect = null;
        path = [];
      }
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
      canvas.classList.remove("ended");
      draw();
    });

    overlayCloseBtn.addEventListener("click", () => {
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
      canvas.classList.remove("ended");
      draw();
    });

    pauseBtn.addEventListener("click", () => showPauseUI());
    resumeBtn.addEventListener("click", () => hidePauseUI());

    window.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") {
        if (paused) {
          hidePauseUI();
          return;
        }
        if (previewMode && endedBy === "time") {
          previewMode = false;
          previewMoves = [];
          previewIndex = 0;
          previewRect = null;
          path = [];
          overlay.classList.add("show");
          overlay.setAttribute("aria-hidden", "false");
          canvas.classList.add("ended");
          draw();
        }
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") updateHighScoreDisplay();
    });

    function applySettings() {
      let n = Math.floor(Number(rowsSelect.value));
      if (!Number.isFinite(n)) n = ROWS;
      n = Math.max(ROWS_MIN, Math.min(ROWS_MAX, n));
      let t = Math.floor(Number(timerSelect.value));
      if (!Number.isFinite(t)) t = GAME_SECONDS;
      t = Math.max(TIMER_MIN, Math.min(TIMER_MAX, Math.round(t / TIMER_STEP) * TIMER_STEP));
      ROWS = n;
      COLS = n * 2;
      GAME_SECONDS = t;
      rowsSelect.value = String(n);
      timerSelect.value = String(t);
      persistUserSettings(n, t);
      resizeCanvas();
      startNewGame();
    }

    applyBtn.addEventListener("click", applySettings);

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, rad) {
        const rr = Math.min(rad, w / 2, h / 2);
        this.moveTo(x + rr, y);
        this.arcTo(x + w, y, x + w, y + h, rr);
        this.arcTo(x + w, y + h, x, y + h, rr);
        this.arcTo(x, y + h, x, y, rr);
        this.arcTo(x, y, x + w, y, rr);
        this.closePath();
      };
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        purgeStalePwaCacheIfNeeded().then(() => {
          let refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
          return navigator.serviceWorker
            .register("./service-worker.js", { scope: "./", updateViaCache: "none" })
            .then((reg) => {
              reg.update();
              const onNewWorker = (worker) => {
                worker.addEventListener("statechange", () => {
                  if (worker.state === "installed" && navigator.serviceWorker.controller) {
                    worker.postMessage({ type: "SKIP_WAITING" });
                  }
                });
              };
              if (reg.waiting) onNewWorker(reg.waiting);
              reg.addEventListener("updatefound", () => {
                if (reg.installing) onNewWorker(reg.installing);
              });
            })
            .catch(() => {
              /* offline or file:// */
            });
        });
      });
    } else {
      purgeStalePwaCacheIfNeeded();
    }

    startNewGame();
  </script>
</body>
</html>
